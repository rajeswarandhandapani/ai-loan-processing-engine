[project]
name = "ai-loan-processing-engine-backend"
version = "0.1.0"
description = "AI Loan Processing Engine backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core Frameworks
    "fastapi==0.122.0",
    "uvicorn[standard]==0.38.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.2.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    # Azure AI Services
    "azure-ai-textanalytics==5.3.0",
    "azure-ai-documentintelligence==1.0.2",
    "azure-search-documents==11.6.0",
    "azure-identity==1.25.1",
    "openai==2.8.1",
    # LangChain
    "langchain==1.1.0",
    "langchain-openai==1.1.0",
    "langchain-anthropic==1.3.0",
    # Utils
    "aiofiles==25.1.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false
