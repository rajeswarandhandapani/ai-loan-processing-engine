[project]
name = "ai-loan-processing-engine-backend"
version = "0.1.0"
description = "AI Loan Processing Engine backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
# Only DIRECT dependencies are declared here (packages the code imports or needs
# to run). Transitive dependencies — pulled in automatically by the packages below —
# are resolved and pinned in uv.lock, not listed here. Notably dropped from the
# original requirements.txt as transitive/unused:
#   - python-dotenv  (hard dependency of pydantic-settings; never imported directly)
#   - azure-identity (never imported; AzureKeyCredential comes from azure-core)
#   - aiofiles       (never imported anywhere)
#   - httpx          (never imported anywhere)
dependencies = [
    # Web framework / server
    "fastapi==0.122.0",
    "uvicorn[standard]==0.38.0",     # ASGI server used to run the app
    "python-multipart==0.0.20",      # required by FastAPI for UploadFile / form parsing
    # Data models / settings
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    # Azure AI Services
    "azure-ai-textanalytics==5.3.0",
    "azure-ai-documentintelligence==1.0.2",
    "azure-search-documents==11.6.0",
    "azure-identity>=1.15",            # imported by langchain-community's AzureSearch client builder
    # LangChain / LangGraph — the agent runtime
    # NOTE: langchain 1.1.0 is broken on current PyPI — it pins langgraph<1.1.0
    # (max 1.0.10), but every langgraph-prebuilt in that range imports
    # `ExecutionInfo` from langgraph.runtime, which 1.0.x does not define.
    # The 1.3.x line resolves to langgraph 1.2.x (has ExecutionInfo).
    "langchain==1.3.14",
    "langchain-openai==1.4.1",         # AzureChatOpenAI + AzureOpenAIEmbeddings; pulls openai transitively
    "langchain-anthropic==1.5.1",
    "langgraph>=1.2,<2",               # explicit: StateGraph / ToolNode / checkpointers
    "langchain-community>=0.4,<0.5",   # AzureSearch vector store for RAG retrieval
    # RAG — see app/rag/ for the pipeline these power
    "langchain-chroma==1.1.0",         # local ChromaDB vector store (pulls chromadb 1.x)
    "langchain-text-splitters>=1.1,<2", # RecursiveCharacterTextSplitter used by app/rag/ingestion.py
    "pypdf>=5",                        # local PDF text extraction (no Azure needed)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Local embedding models — opt in with `uv sync --group local-rag`. Kept out of the
# default install because sentence-transformers pulls torch (multiple GB).
local-rag = [
    "langchain-huggingface>=1.0",
    "sentence-transformers>=3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI intentionally uses Depends()/Query()/File() as argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E501"]
# Dev/utility scripts insert sys.path before importing app.* (E402) and keep
# their own broader style.
"scripts/**" = ["B", "E501", "F401", "E402"]

[tool.uv]
package = false
