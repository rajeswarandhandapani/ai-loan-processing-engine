[project]
name = "ai-loan-processing-engine-backend"
version = "0.1.0"
description = "AI Loan Processing Engine backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
# Only DIRECT dependencies are declared here (packages the code imports or needs
# to run). Transitive dependencies — pulled in automatically by the packages below —
# are resolved and pinned in uv.lock, not listed here. Notably dropped from the
# original requirements.txt as transitive/unused:
#   - python-dotenv  (hard dependency of pydantic-settings; never imported directly)
#   - azure-identity (never imported; AzureKeyCredential comes from azure-core)
#   - aiofiles       (never imported anywhere)
#   - httpx          (never imported anywhere)
dependencies = [
    # Web framework / server
    "fastapi==0.122.0",
    "uvicorn[standard]==0.38.0",     # ASGI server used to run the app
    "python-multipart==0.0.20",      # required by FastAPI for UploadFile / form parsing
    # Data models / settings
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    # Azure AI Services
    "azure-ai-textanalytics==5.3.0",
    "azure-ai-documentintelligence==1.0.2",
    "azure-search-documents==11.6.0",
    # LLM providers
    "openai==2.48.0",                # bumped from 2.8.1: langchain-openai 1.4.1 needs openai>=2.45.0
    # LangChain
    # NOTE: langchain 1.1.0 is broken on current PyPI — it pins langgraph<1.1.0
    # (max 1.0.10), but every langgraph-prebuilt in that range imports
    # `ExecutionInfo` from langgraph.runtime, which 1.0.x does not define.
    # Bumped to the 1.3.x line, which resolves to langgraph 1.2.x (has ExecutionInfo).
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
    "langchain-anthropic==1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false
